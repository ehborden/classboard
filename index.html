<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Classboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@500..700&display=swap">
<style>
/* Layout: toolbar on top, one free-form board below. Widgets are panels placed by fraction of the board, so a screen scales from a laptop to a projector. */
:root{
  --font-display:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-body:var(--font-display);
  --bg:#eef1f5; --bar:#ffffff; --ink:#15202b; --muted:#404c5a;
  --panel:#ffffff; --panel2:#f0f3f7; --line:#d2dae4;
  --accent:#085a56; --accent-ink:#ffffff; --accent-soft:#e3f3f1;
  --sun:#f2b01e; --on-sun:#2b1d00; --danger:#b42318; --on-danger:#ffffff;
  --mist:#dce4ed;
  --shadow:0 1px 2px rgba(15,25,35,.08),0 8px 22px rgba(15,25,35,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151b; --bar:#161e26; --ink:#e8eef4; --muted:#b9c5d1;
    --panel:#1b2530; --panel2:#243141; --line:#314052;
    --accent:#6fdcd3; --accent-ink:#06211f; --accent-soft:#143836;
    --sun:#f5be3a; --on-sun:#2b1d00; --danger:#ff8a80; --on-danger:#3a0a06;
    --mist:#0b1117;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151b; --bar:#161e26; --ink:#e8eef4; --muted:#b9c5d1;
  --panel:#1b2530; --panel2:#243141; --line:#314052;
  --accent:#6fdcd3; --accent-ink:#06211f; --accent-soft:#143836;
  --sun:#f5be3a; --on-sun:#2b1d00; --danger:#ff8a80; --on-danger:#3a0a06;
  --mist:#0b1117;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:500 14px/1.4 var(--font-body);
  display:flex; flex-direction:column; gap:10px;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Toolbar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.brand{font:700 18px var(--font-display);letter-spacing:-.01em;border:1px solid transparent;background:transparent;border-radius:8px;padding:2px 6px;margin-left:-7px;max-width:40vw;min-width:0}
.brand:hover{border-color:var(--line)}
.brand:focus{border-color:var(--accent);background:var(--panel)}
.tabs{flex:1 1 220px;min-width:0;display:flex;gap:4px;overflow-x:auto;padding:2px}
.tab{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--panel2)}
.tab.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.tab.add{padding:5px 11px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger,.tb.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.big{padding:9px 18px;font-size:15px}
.btn.icon{display:inline-grid;place-items:center;padding:7px 9px}
.lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px}
.chip:hover{background:var(--panel2)}
.chip.off{opacity:.55;text-decoration:line-through}
.fld{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;max-width:100%}

/* Board */
.board{position:relative;flex:1;min-height:320px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.bg-mist{background:var(--mist)}
.bg-sky{background:#cfe2f5}
.bg-sage{background:#d2e4d6}
.bg-blush{background:#f0d8dc}
.bg-slate{background:#3a4757}
.bg-night{background:#10161d}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--ink)}
.bg-slate .empty,.bg-night .empty{color:#e8eef4}
.empty p{margin:0}

/* Widget frame */
.widget{position:absolute;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.widget:focus{outline:none}
.widget.min .wbody,.widget.min .resize{display:none}
.widget.min .whead{border-bottom:0}
.present .widget.min .whead{display:flex;cursor:pointer}
.present .widget.min .wtools>:not(.minb){display:none}
.widget.drop{outline:3px dashed var(--accent);outline-offset:-3px}
.whead{display:flex;align-items:center;gap:6px;padding:3px 5px 3px 11px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none;color:var(--muted)}
.whead:active{cursor:grabbing}
.wlabel{font:600 11px var(--font-body);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wtools{margin-left:auto;display:flex;gap:2px;flex:none}
.tb{height:24px;min-width:24px;padding:0 7px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 12px var(--font-body);border-radius:6px;cursor:pointer}
.tb:hover{background:var(--line);color:var(--ink)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb[title="More list options"]{min-width:18px;padding:0 4px;margin-left:-3px}
.wbody{position:relative;flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;gap:8px;padding:10px 12px;overflow:hidden}
.wbody.flush{padding:0;gap:0}
.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;z-index:2;
  background:linear-gradient(135deg,transparent 52%,var(--muted) 52%,var(--muted) 60%,transparent 60%,transparent 72%,var(--muted) 72%,var(--muted) 80%,transparent 80%);opacity:.55}

/* Clock */
.clock{align-items:center;justify-content:center;text-align:center;gap:0}
.clock .time{font-family:var(--font-display);font-weight:700;font-size:min(var(--fs,22cqw),56cqh);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.clock .ampm{font-size:.34em;font-weight:600;margin-left:.2em;color:var(--muted);letter-spacing:0}
.clock .date{margin-top:.5em;font-size:min(6.2cqw,15cqh);color:var(--muted)}

/* Timer */
.timer{align-items:center;justify-content:center;text-align:center}
@container (max-height:250px){.timer .presets{display:none}}
@container (max-height:170px){.timer .tmsg{display:none}}
.timer .t{font-family:var(--font-display);font-weight:700;font-size:min(24cqw,26cqh);line-height:1;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .prog{width:100%;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line);flex:none}
.timer .prog i{display:block;height:100%;width:100%;background:var(--accent);transition:width .4s linear}
.timer .tmsg{min-height:1.2em;font-weight:600}
.dialbox{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.dialbox svg{height:100%;max-width:100%;font-family:var(--font-display)}
.timer:not(.dialmode) .dialbox,.timer.dialmode .t,.timer.dialmode .prog,.timer.dialmode .tmsg{display:none}
.timer .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.timer .tin{width:4.2em;text-align:center;cursor:text}
.timer .tin:focus{outline:2px solid var(--accent);background:var(--panel)}
.widget.done .wbody{background:var(--sun);color:var(--on-sun)}
.widget.done .prog i{background:var(--on-sun)}

/* Text */
.ed{flex:1;min-height:0;overflow:auto;outline:none;padding:12px 14px;line-height:1.3;overflow-wrap:anywhere}
.ed:empty::before{content:attr(data-ph);color:var(--muted)}
.ed ul,.ed ol{margin:.3em 0;padding-left:1.2em}
.ed ol{padding-left:1.5em}

/* Image */
.imgwrap{flex:1;min-height:0;display:flex}
.music .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.music .pk-chips{justify-content:center;align-items:center}
.music-frame{flex:1;width:100%;min-height:0;border:0;display:block}
.imgwrap img{width:100%;height:100%;object-fit:contain;display:block}
.dz{flex:1;margin:10px;border:2px dashed var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;color:var(--muted)}

/* Agenda */
.agenda{gap:6px}
.ag-title{border:0;background:transparent;font:700 min(7cqw,20px) var(--font-display);padding:2px 4px;width:100%;border-radius:6px}
.ag-title:hover,.ag-title:focus{background:var(--panel2)}
.ag-list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:max(var(--min-text,0px),clamp(13px,4.4cqw,22px))}
.ag-row{display:grid;grid-template-columns:24px auto minmax(0,1fr) auto;align-items:center;gap:4px;padding:3px 4px;border-radius:8px}
.ag-row.now{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.ag-row.now .ag-txt,.ag-row.now .ag-time{font-weight:700}
.present .ag-row.out{display:none}
.present .ag-row.now{font-size:max(var(--min-now),1.5em)}
.ag-row.done .ag-txt,.ag-row.done .ag-time{text-decoration:line-through;color:var(--muted)}
.ag-chk{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;padding:0}
.ag-chk.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--panel)}
.ag-time,.ag-txt{border:0;background:transparent;padding:3px 4px;border-radius:6px;font-size:inherit;min-width:0;width:100%}
.ag-time{width:auto;font-variant-numeric:tabular-nums;font-weight:600}
.ag-time::-webkit-calendar-picker-indicator{display:none}
.ag-time:hover,.ag-txt:hover,.ag-time:focus,.ag-txt:focus{background:var(--panel)}
.ag-rm{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:6px;width:22px;height:22px;padding:0}
.ag-rm:hover{background:var(--line);color:var(--ink)}
.tb:disabled{opacity:.45;cursor:default}
.st-list{flex:1;min-height:0;overflow:auto;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:max(var(--min-text,0px),clamp(14px,5.2cqw,34px))}
.st-row{display:grid;grid-template-columns:1.3em 1.3em minmax(0,1fr) auto;align-items:center;gap:.35em;padding:.15em .25em;border-radius:8px}
.st-n{font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.st-chk{width:1.2em;height:1.2em;border-radius:6px;border:2px solid var(--ink);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--ink)}
.st-txt{border:0;background:transparent;padding:.15em .25em;border-radius:6px;font-size:inherit;min-width:0;width:100%}
.st-txt:hover,.st-txt:focus{background:var(--panel2)}
.st-row.cur{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--accent)}
.st-row.cur .st-txt{font-weight:700}
.st-row.done .st-txt{text-decoration:line-through;text-decoration-thickness:.08em}

/* Picker */
.picker{gap:8px}
.pk-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.pk-top .sel{max-width:11em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.size{display:flex;align-items:center;gap:6px}
.size[hidden]{display:none}
.pk-out{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;overflow:auto}
.pk-name{font-family:var(--font-display);font-weight:700;font-size:min(14cqw,30cqh);line-height:1.05;overflow-wrap:anywhere;padding:4px}
.pk-hint,.pk-empty{color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.pk-grid{width:100%;align-self:flex-start;display:grid;grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr));gap:8px;text-align:left;font-size:clamp(13px,2.6cqw,26px)}
.pk-card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;min-width:0}
.pk-ch{font:600 .7em var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.pk-card ul{margin:0;padding:0;list-style:none;font-weight:600}
.pk-card li{overflow-wrap:anywhere}
.pk-bot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.pk-info{color:var(--muted);font-size:12px;flex:1 1 8em;min-width:0}
.pk-here{position:absolute;inset:0;background:var(--panel);z-index:3;padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.pk-here[hidden]{display:none}
.pk-here .ph{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.pk-chips{display:flex;flex-wrap:wrap;gap:6px}

/* Popovers, modal, toasts */
.pop{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px;width:max-content;min-width:230px;max-width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.pop h3{margin:0;font:600 11px var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pop .opt{display:flex;flex-direction:column;align-items:flex-start;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left;width:100%}
.pop .opt:hover{background:var(--panel2)}
.pop .opt small{color:var(--muted)}
.pop p{margin:0;color:var(--muted);font-size:13px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.modal-back{position:fixed;inset:0;z-index:1100;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(720px,100%);max-height:100%;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0;font:700 20px var(--font-display)}
.cl-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
.cl-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.cl-item{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.cl-item small{color:var(--muted)}
.cl-item.on{border-color:var(--accent);background:var(--accent-soft)}
.cl-edit{display:flex;flex-direction:column;gap:8px;min-width:0}
.cl-edit label{font-weight:600}
.cl-count{color:var(--muted);font-size:12px}
.cl-empty{color:var(--muted)}
.toasts{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:1200;display:flex;flex-direction:column;gap:6px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:9px 13px;box-shadow:var(--shadow)}

/* Present mode */
.pbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:900;gap:6px;align-items:center;background:var(--bar);border:1px solid var(--line);border-radius:999px;padding:4px 6px;box-shadow:var(--shadow);opacity:.35;transition:opacity .2s}
.pbar:hover,.pbar:focus-within,.pbar.wake{opacity:1}
.calm *,.calm *::before,.calm *::after{transition:none!important;animation:none!important}
.calm-clock{position:absolute;right:2%;bottom:3%;z-index:50;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.25em .6em;font:700 max(4vh,28px)/1 var(--font-display);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.pbar span{padding:0 8px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.present .pbar{display:flex}
/* Back-row sizing for a room up to 20 feet deep, on a 1080-pixel-tall projected image:
   body text about 1.3 px per foot (26px = 2.4vh) and the agenda now-line about 3.3 px per foot (66px = 6vh). */
.present{--min-text:2.4vh;--min-now:6vh}
.present .bar,.present .whead,.present .resize,.present .ag-rm{display:none}
.present .st-txt{pointer-events:none}

/* Seating chart */
.seats{gap:6px}
.seat-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.seat-top .sel{max-width:12em}
.seat-hint{color:var(--muted);font-size:12px;flex:1 1 12em;min-width:0}
.seat-canvas{position:relative;flex:1;min-height:0;border:1px dashed var(--line);border-radius:10px;container-type:size;overflow:hidden}
.present .seat-canvas{border-color:transparent}
.seat-front{position:absolute;left:30%;right:30%;top:0;text-align:center;font:600 max(11px,2.6cqh) var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid var(--line);padding:2px 0;pointer-events:none}
.seat-item{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none}
.seat-table{background:var(--panel2);border:2px solid var(--line);border-radius:10px}
.seat-chair{background:var(--panel);border:2px solid var(--muted);border-radius:12px;font-weight:700;font-size:max(12px,min(2.4cqw,4.6cqh));line-height:1.05;padding:3px;overflow:hidden;overflow-wrap:anywhere}
.seat-chair.empty{border-style:dashed}
.arranging .seat-item{cursor:move}
.seat-label{border:0;background:transparent;text-align:center;width:90%;font:600 max(11px,1.8cqw) var(--font-body);color:var(--muted);border-radius:6px}
.seat-label:focus{background:var(--panel)}
.seat-table{flex-direction:column;gap:4px}
.seat-around{display:none;font-size:11px;padding:2px 8px}
.arranging .seat-around{display:inline-block}
.present .seat-around{display:none!important}
.seat-name{cursor:grab;padding:2px 4px;border-radius:6px}
.seat-sel{outline:3px solid var(--accent);outline-offset:1px}
.seat-x,.seat-rs{display:none}
.arranging .seat-x{display:grid;place-items:center;position:absolute;top:-1px;right:-1px;width:20px;height:20px;border:0;border-radius:6px;background:var(--line);color:var(--ink);cursor:pointer;padding:0;font-size:14px;line-height:1}
.arranging .seat-rs{display:block;position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 55%,var(--muted) 55%,var(--muted) 65%,transparent 65%)}
.seat-tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-height:30%;overflow:auto;min-height:34px;padding:4px;border-radius:10px;background:var(--panel2)}
.seat-tray .chip{touch-action:none;font-weight:600}
.seat-ghost{position:fixed;z-index:2000;pointer-events:none;background:var(--panel);border:2px solid var(--accent);border-radius:999px;padding:3px 10px;font-weight:700;box-shadow:var(--shadow);transform:translate(-50%,-60%)}
.present .seat-tray,.present .seat-top,.present .seat-x,.present .seat-rs{display:none}
.present .seat-canvas,.present .seat-label{pointer-events:none}
.present .ag-title,.present .ag-time,.present .ag-txt{pointer-events:auto}

/* Phone: widgets stack in one column */
@media (max-width:700px){
  .board{overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:10px}

<script>
(function(){
'use strict';
const KEY='classboard.v1';
const $=(s,r)=>(r||document).querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const narrow=window.matchMedia('(max-width: 700px)');

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else if(v===true) e.setAttribute(k,'');
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{
    if(c==null||c===false) return;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  });
  return e;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- State and saving ---------- */
let S=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);}catch(e){S=null;}

/* Default layout: agenda on the left, text box in the center, clock and timer stacked on the right. */
function guideWidgets(html,items){
  const W=(type,x,y,w,hh,z,data)=>({id:uid(),type,x,y,w,h:hh,z,data});
  return [
    W('agenda',.02,.02,.22,.62,1,{title:'Today',items:items||[]}),
    W('text',.255,.02,.47,.44,2,{html:html||'',fs:44}),
    W('clock',.77,.03,.22,.27,3,{h24:false,sec:false,date:true}),
    W('timer',.745,.34,.25,.63,4,{dur:300})];
}
function seed(){
  const cls={id:uid(),name:'Sample class',students:['Ada','Ben','Chloe','Dev','Elena','Femi','Grace','Hiro','Isla','Jamal'],absent:[]};
  const sc={id:uid(),name:'Screen 1',bg:'mist',widgets:guideWidgets('<b>Do now</b><br>Solve the first problem on your own. Then compare with a partner.',[
    {id:uid(),t:'08:30',txt:'Do now',done:false},
    {id:uid(),t:'08:40',txt:'Mini lesson',done:false},
    {id:uid(),t:'09:05',txt:'Practice',done:false},
    {id:uid(),t:'09:30',txt:'Share out',done:false}])};
  return {v:1,active:sc.id,classes:[cls],screens:[sc]};
}

const TYPES={
  clock:{label:'Clock',desc:'Time and date',w:.22,h:.24,data:()=>({h24:false,sec:false,date:true}),build:buildClock},
  timer:{label:'Timer',desc:'Countdown with a bell',w:.24,h:.52,data:()=>({dur:300}),build:buildTimer},
  steps:{label:'Task steps',desc:'Up to five steps to check off',w:.40,h:.50,data:()=>({title:'Steps',items:[{id:uid(),txt:'',done:false}]}),build:buildSteps},
  seats:{label:'Seating chart',desc:'Tables and chairs with names or initials',w:.63,h:.87,data:()=>({classId:S.classes[0]?S.classes[0].id:null,items:[],seats:{},initials:false}),build:buildSeats},
  picker:{label:'Names and groups',desc:'Pick a name, make partners or groups',w:.44,h:.44,data:()=>({classId:S.classes[0]?S.classes[0].id:null,mode:'one',size:3,used:[],result:null}),build:buildPicker},
  text:{label:'Text box',desc:'Instructions, questions, notes',w:.40,h:.36,data:()=>({html:'',fs:28}),build:buildText},
  image:{label:'Image',desc:'Upload, drop, or paste a picture',w:.30,h:.40,data:()=>({src:null,fit:'contain'}),build:buildImage},
  agenda:{label:'Agenda',desc:'Schedule with a live marker',w:.22,h:.56,data:()=>({title:'Today',items:[]}),build:buildAgenda},
  music:{label:'Music',desc:'Play a Spotify or YouTube link',w:.30,h:.40,data:()=>({url:''}),build:buildMusic}
};

/* Fill in missing fields so saved or imported data is safe to render. */
function normalize(D){
  if(!Array.isArray(D.classes)) D.classes=[];
  D.classes.forEach(c=>{c.students=c.students||[];c.absent=c.absent||[];});
  D.screens.forEach(s=>{s.widgets=(s.widgets||[]).filter(w=>TYPES[w.type]);s.bg=s.bg||'mist';});
  if(!D.screens.some(s=>s.id===D.active)) D.active=D.screens[0].id;
  return D;
}
if(!S||!Array.isArray(S.screens)||!S.screens.length) S=seed();
normalize(S);
const cur=()=>S.screens.find(s=>s.id===S.active)||S.screens[0];

let saveT=null,warned=false;
function flush(){
  try{localStorage.setItem(KEY,JSON.stringify(S));warned=false;return true;}
  catch(e){
    if(!warned){warned=true;toast('This browser is not saving your boards. Storage may be full or blocked. Remove large images to free space.');}
    return false;
  }
}
function save(){clearTimeout(saveT);saveT=setTimeout(flush,300);}
window.addEventListener('pagehide',()=>{clearTimeout(saveT);flush();});

function toast(msg){
  const t=h('div',{class:'toast'},msg);
  $('#toasts').append(t);
  setTimeout(()=>t.remove(),5500);
}
function armed(btn,label,action,armedLabel){
  let t=null;
  btn.addEventListener('click',()=>{
    if(t){clearTimeout(t);t=null;btn.textContent=label;btn.classList.remove('danger');action();return;}
    t=setTimeout(()=>{t=null;btn.textContent=label;btn.classList.remove('danger');},2600);
    btn.textContent=armedLabel||'Sure?';
    btn.classList.add('danger');
  });
}
function tbtn(label,title,fn){
  return h('button',{class:'tb',type:'button',title,'aria-label':title,onmousedown:e=>e.preventDefault(),onclick:fn},label);
}
function tog(label,title,get,set){
  const b=tbtn(label,title,()=>{set(!get());save();sync();});
  const sync=()=>{b.classList.toggle('on',!!get());b.setAttribute('aria-pressed',String(!!get()));};
  sync();
  return b;
}

/* ---------- Board ---------- */
const boardEl=$('#board');
let ticks=[],classHooks=[];
setInterval(()=>{ticks.forEach(f=>{try{f();}catch(e){}});},500);

function place(el,w){
  el.style.left=(w.x*100)+'%';el.style.top=(w.y*100)+'%';
  el.style.width=(w.w*100)+'%';el.style.height=w.min?'auto':(w.h*100)+'%';
  el.style.zIndex=w.z||1;
  el.classList.toggle('min',!!w.min);
}
function bringFront(w,el){
  const ws=cur().widgets;
  const mz=Math.max(0,...ws.map(x=>x.z||0));
  if((w.z||0)<mz||ws.filter(x=>x.z===mz).length>1){w.z=mz+1;el.style.zIndex=w.z;}
}
function renderBoard(){
  ticks=[];classHooks=[];
  const sc=cur();
  boardEl.className='board bg-'+sc.bg;
  boardEl.replaceChildren();
  [...sc.widgets].sort((a,b)=>a.y-b.y||a.x-b.x).forEach(w=>boardEl.append(renderWidget(w)));
  /* Calm mode always keeps the time on the board. */
  if(S.calm&&!sc.widgets.some(w=>w.type==='clock')){
    const c=h('div',{class:'calm-clock','aria-label':'Time'});
    const draw=()=>{const n=new Date();c.textContent=n.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});};
    draw();ticks.push(draw);boardEl.append(c);
  }
  if(!sc.widgets.length){
    boardEl.append(h('div',{class:'empty'},h('p',null,'This screen is empty.'),
      h('button',{class:'btn primary',type:'button',onclick:e=>addPop(e.currentTarget)},'Add a widget')));
  }
}
function renderWidget(w){
  const T=TYPES[w.type];
  const tools=h('div',{class:'wtools'});
  const head=h('header',{class:'whead'},h('span',{class:'wlabel'},T.label),tools);
  const body=h('div',{class:'wbody '+w.type});
  const handle=h('div',{class:'resize',title:'Resize'});
  const el=h('section',{class:'widget',tabindex:'-1','data-id':w.id},head,body,handle);
  place(el,w);
  T.build(w,body,tools,el);
  const rm=tbtn('×','Remove this widget',null);
  armed(rm,'×',()=>{
    const sc=cur();sc.widgets=sc.widgets.filter(x=>x!==w);save();el.remove();
    if(!sc.widgets.length) renderBoard();
  },'Remove?');
  /* Minimize keeps the widget on the board as just its title bar. Timers keep running and music keeps playing. */
  const minB=tbtn(w.min?'\u25A1':'\u2212',w.min?'Restore this widget':'Minimize this widget',()=>toggleMin());
  minB.classList.add('minb');
  function toggleMin(){
    w.min=!w.min;place(el,w);save();
    minB.textContent=w.min?'\u25A1':'\u2212';
    minB.title=w.min?'Restore this widget':'Minimize this widget';minB.setAttribute('aria-label',minB.title);
  }
  head.addEventListener('dblclick',e=>{if(!e.target.closest('button'))toggleMin();});
  tools.append(minB,rm);
  el.addEventListener('pointerdown',e=>{
    bringFront(w,el);
    if(!e.target.closest('input,textarea,select,[contenteditable="true"],button')) el.focus({preventScroll:true});
  },true);
  head.addEventListener('pointerdown',e=>startDrag(e,w,el,head));
  handle.addEventListener('pointerdown',e=>startResize(e,w,el,handle));
  return el;
}
function startDrag(e,w,el,head){
  if(e.button!==0||narrow.matches||e.target.closest('button,input,select')) return;
  const r=boardEl.getBoundingClientRect();
  const sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;
  head.setPointerCapture(e.pointerId);
  const mv=ev=>{
    w.x=clamp(ox+(ev.clientX-sx)/r.width,0,Math.max(0,1-w.w));
    w.y=clamp(oy+(ev.clientY-sy)/r.height,0,Math.max(0,1-(w.min?el.offsetHeight/r.height:w.h)));
    place(el,w);
  };
  const up=()=>{head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up);head.removeEventListener('pointercancel',up);save();};
  head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);head.addEventListener('pointercancel',up);
}
function startResize(e,w,el,handle){
  if(e.button!==0||narrow.matches) return;
  e.preventDefault();
  const r=boardEl.getBoundingClientRect();
  const sx=e.clientX,sy=e.clientY,ow=w.w,oh=w.h;
  const minW=Math.min(.5,150/r.width),minH=Math.min(.5,110/r.height);
  handle.setPointerCapture(e.pointerId);
  const mv=ev=>{
    w.w=clamp(ow+(ev.clientX-sx)/r.width,minW,1-w.x);
    w.h=clamp(oh+(ev.clientY-sy)/r.height,minH,1-w.y);
    place(el,w);
  };
  const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);save();};
  handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
}

/* ---------- Clock ---------- */
function buildClock(w,body,tools){
  const t=h('div',{class:'time'}),d=h('div',{class:'date'});
  body.append(t,d);
  function draw(){
    const n=new Date();
    let hh=n.getHours();
    const mm=String(n.getMinutes()).padStart(2,'0'),ss=String(n.getSeconds()).padStart(2,'0');
    let ap='';
    if(!w.data.h24){ap=hh>=12?'PM':'AM';hh=hh%12||12;}else hh=String(hh).padStart(2,'0');
    t.style.setProperty('--fs',w.data.sec?'15cqw':'22cqw');
    t.replaceChildren(hh+':'+mm+(w.data.sec?':'+ss:''),ap?h('span',{class:'ampm'},ap):null);
    d.hidden=!w.data.date;
    d.textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  }
  tools.append(
    tog('24h','24-hour time',()=>w.data.h24,v=>{w.data.h24=v;draw();}),
    tog('Sec','Show seconds',()=>w.data.sec,v=>{w.data.sec=v;draw();}),
    tog('Date','Show date',()=>w.data.date,v=>{w.data.date=v;draw();})
  );
  draw();ticks.push(draw);
}

/* ---------- Timer ---------- */
const RT={};
let AC=null,lastTimer=null;
function ensureAudio(){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}
}
function beep(){
  if(S.calm)return;
  ensureAudio();if(!AC)return;
  [0,.4,.8].forEach(d=>{
    const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+d;
    o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.35,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+.32);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.34);
  });
}
function fmtTime(sec){
  sec=Math.max(0,Math.ceil(sec));
  const hr=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return hr?hr+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):m+':'+String(s).padStart(2,'0');
}
function buildTimer(w,body,tools,el){
  const rt=RT[w.id]||(RT[w.id]={running:false,endAt:0,left:w.data.dur,done:false});
  const disp=h('div',{class:'t'}),fill=h('i'),prog=h('div',{class:'prog'},fill),msg=h('div',{class:'tmsg'}),dial=h('div',{class:'dialbox'});
  let lastSvg='';
  const start=h('button',{class:'btn primary big',type:'button'},'Start');
  const reset=h('button',{class:'btn',type:'button'},'Reset');
  const setDur=s=>{
    w.data.dur=clamp(Math.round(s),10,99*60);
    rt.running=false;rt.left=w.data.dur;rt.done=false;el.classList.remove('done');
    save();draw();
  };
  /* Typed times accept minutes ("7" or "2.5") or minutes and seconds ("2:30"). */
  const typed=h('input',{class:'chip tin',type:'text',inputmode:'decimal',placeholder:'Type','aria-label':'Type a time in minutes, or minutes:seconds',title:'Type minutes, like 7 or 2:30, then press Enter'});
  const takeTyped=()=>{
    const v=typed.value.trim();if(!v)return;
    const m=v.match(/^(\d+):(\d{1,2})$/),sec=m?(+m[1])*60+(+m[2]):parseFloat(v)*60;
    if(isFinite(sec)&&sec>0)setDur(sec);else toast('Type minutes, like 7 or 2:30.');
    typed.value='';typed.blur();
  };
  typed.addEventListener('keydown',e=>{if(e.key==='Enter')takeTyped();if(e.key==='Escape'){e.stopPropagation();typed.value='';typed.blur();}});
  typed.addEventListener('change',takeTyped);
  const presets=h('div',{class:'row presets'},
    [1,3,5,10].map(m=>h('button',{class:'chip',type:'button',onclick:()=>setDur(m*60)},m+' min')),typed,
    h('button',{class:'chip',type:'button',title:'One minute less','aria-label':'One minute less',onclick:()=>setDur(w.data.dur-60)},'-1'),
    h('button',{class:'chip',type:'button',title:'One minute more','aria-label':'One minute more',onclick:()=>setDur(w.data.dur+60)},'+1'));
  function finish(){
    rt.running=false;rt.left=0;rt.done=true;el.classList.add('done');if(w.data.bell)beep();
  }
  function draw(){
    let left=rt.running?(rt.endAt-Date.now())/1000:rt.left;
    if(rt.running&&left<=0&&!rt.done) finish();
    if(rt.done) left=0;
    body.classList.toggle('dialmode',w.data.view!=='bar');
    if(w.data.view!=='bar'){
      const svg=dialSVG(left,w.data.dur,rt.done?{done:true,ink:'var(--on-sun)',accent:'var(--on-sun)',soft:'var(--sun)',panel:'var(--sun)'}:{ink:'var(--ink)',accent:'var(--accent)',soft:'var(--accent-soft)',panel:'var(--panel)'});
      if(svg!==lastSvg){dial.innerHTML=svg;lastSvg=svg;}
    }
    disp.textContent=fmtTime(left);
    fill.style.width=clamp(left/w.data.dur,0,1)*100+'%';
    start.textContent=rt.running?'Pause':(rt.left<w.data.dur&&!rt.done?'Resume':'Start');
    msg.textContent=rt.done?'Time is up':'';
  }
  rt.toggle=()=>{
    if(rt.done){rt.done=false;rt.left=w.data.dur;el.classList.remove('done');}
    if(rt.running){rt.left=Math.max(0,(rt.endAt-Date.now())/1000);rt.running=false;}
    else{ensureAudio();if(rt.left<=0)rt.left=w.data.dur;rt.endAt=Date.now()+rt.left*1000;rt.running=true;lastTimer=w.id;}
    draw();
  };
  start.addEventListener('click',rt.toggle);
  reset.addEventListener('click',()=>{rt.running=false;rt.left=w.data.dur;rt.done=false;el.classList.remove('done');draw();});
  body.append(dial,disp,prog,msg,h('div',{class:'row'},start,reset),presets);
  tools.append(tog('Bell','Ring a bell when time is up. Off by default.',()=>!!w.data.bell,v=>{w.data.bell=v;}),
    tog('Dial','Show the dial, or numbers and a bar',()=>w.data.view!=='bar',v=>{w.data.view=v?'dial':'bar';draw();}));
  if(rt.done) el.classList.add('done');
  draw();ticks.push(draw);
}

/* ---------- Text ---------- */
function buildText(w,body,tools){
  const ed=h('div',{class:'ed',contenteditable:'true',spellcheck:'true','data-ph':'Type here. Select text, then use B, I, or List above.','aria-label':'Text box'});
  ed.innerHTML=w.data.html||'';
  ed.style.fontSize='max(var(--min-text,0px),'+w.data.fs+'px)';
  const sync=()=>{w.data.html=ed.innerHTML;save();};
  ed.addEventListener('input',sync);
  ed.addEventListener('paste',e=>{
    const t=(e.clipboardData||window.clipboardData).getData('text/plain');
    e.preventDefault();document.execCommand('insertText',false,t);
  });
  const cmd=c=>{ed.focus();document.execCommand(c);sync();};
  const size=d=>{w.data.fs=clamp(w.data.fs+d,14,140);ed.style.fontSize='max(var(--min-text,0px),'+w.data.fs+'px)';save();};
  body.classList.add('flush');
  body.append(ed);
  tools.append(
    tbtn('B','Bold',()=>cmd('bold')),
    tbtn('I','Italic',()=>cmd('italic')),
    /* List turns bullets on or off. The arrow opens a menu to pick bullets or numbers. */
    tbtn('List','Bullet list on or off',()=>cmd(document.queryCommandState('insertOrderedList')?'insertOrderedList':'insertUnorderedList')),
    tbtn('\u25BE','More list options',e=>{
      /* Keep the text selection so the list applies to what was selected. */
      const sel=getSelection(),rg=sel.rangeCount&&ed.contains(sel.anchorNode)?sel.getRangeAt(0):null;
      const pick=c=>()=>{closePop();ed.focus();if(rg){sel.removeAllRanges();sel.addRange(rg);}cmd(c);};
      openPop(e.currentTarget,box=>box.append(h('h3',null,'List'),
        h('button',{class:'opt',type:'button',onmousedown:ev=>ev.preventDefault(),onclick:pick('insertUnorderedList')},'Bullets'),
        h('button',{class:'opt',type:'button',onmousedown:ev=>ev.preventDefault(),onclick:pick('insertOrderedList')},'Numbers')));
    }),
    tbtn('A-','Smaller text',()=>size(-4)),
    tbtn('A+','Larger text',()=>size(4))
  );
}

/* ---------- Image ---------- */
function shrink(f){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      if(!im.naturalWidth){URL.revokeObjectURL(url);rej();return;}
      const M=1600,s=Math.min(1,M/Math.max(im.naturalWidth,im.naturalHeight));
      const c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      let out=f.type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.85);
      if(out.length>1.5e6) out=c.toDataURL('image/jpeg',.8);
      res(out);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej();};
    im.src=url;
  });
}
function buildImage(w,body,tools,el){
  body.classList.add('flush');
  const file=h('input',{type:'file',accept:'image/*',hidden:true,'aria-label':'Choose an image'});
  const take=f=>{
    if(!f||!f.type.startsWith('image/')){toast('That file is not an image.');return;}
    shrink(f).then(src=>{w.data.src=src;save();draw();}).catch(()=>toast('Could not read that image.'));
  };
  file.addEventListener('change',()=>{take(file.files[0]);file.value='';});
  el.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();el.classList.add('drop');}});
  el.addEventListener('dragleave',()=>el.classList.remove('drop'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('drop');
    take([...e.dataTransfer.files].find(f=>f.type.startsWith('image/')));
  });
  el.addEventListener('paste',e=>{
    const it=[...((e.clipboardData&&e.clipboardData.items)||[])].find(i=>i.type.startsWith('image/'));
    if(it){e.preventDefault();take(it.getAsFile());}
  });
  const replaceB=tbtn('Replace','Choose a different image',()=>file.click());
  const fitB=tbtn('Fit','Switch between fit and fill',()=>{w.data.fit=w.data.fit==='cover'?'contain':'cover';save();draw();});
  const clearB=tbtn('Clear','Remove the image',()=>{w.data.src=null;save();draw();});
  tools.append(replaceB,fitB,clearB);
  function draw(){
    const has=!!w.data.src;
    [replaceB,fitB,clearB].forEach(b=>b.hidden=!has);
    fitB.textContent=w.data.fit==='cover'?'Fill':'Fit';
    body.replaceChildren(file);
    if(has){
      const im=h('img',{src:w.data.src,alt:'Uploaded image'});
      im.style.objectFit=w.data.fit||'contain';
      body.append(h('div',{class:'imgwrap'},im));
    }else{
      body.append(h('div',{class:'dz'},
        h('div',null,'Drop an image here, or click this widget and paste it.'),
        h('button',{class:'btn',type:'button',onclick:()=>file.click()},'Choose image')));
    }
  }
  draw();
}

/* ---------- Music ---------- */
/* Turns a Spotify or YouTube share link into the address of its embedded player. */
function embedURL(raw){
  let u;try{u=new URL(String(raw).trim());}catch(e){return null;}
  const host=u.hostname.replace(/^(www|m|music)\./,'');
  if(host==='open.spotify.com'){
    const m=u.pathname.match(/(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);
    return m?'https://open.spotify.com/embed/'+m[1]+'/'+m[2]:null;
  }
  const list=u.searchParams.get('list');
  let id=null;
  if(host==='youtu.be') id=u.pathname.slice(1).split('/')[0];
  else if(host==='youtube.com'||host==='youtube-nocookie.com'){
    const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]+)/);
    id=m?m[1]:u.searchParams.get('v');
  }else return null;
  if(id&&id!=='videoseries') return 'https://www.youtube-nocookie.com/embed/'+id+(list?'?list='+encodeURIComponent(list):'');
  return list?'https://www.youtube-nocookie.com/embed/videoseries?list='+encodeURIComponent(list):null;
}
function buildMusic(w,body,tools){
  body.classList.add('flush');
  if(S.calm){body.append(h('div',{class:'dz'},'Music is off in calm mode.'));return;}
  let editing=false;
  const changeB=tbtn('Change','Use a different link',()=>{editing=true;draw();});
  tools.append(changeB);
  const label=u=>{try{const x=new URL(u);return (x.hostname.includes('spotify')?'Spotify ':'YouTube ')+x.pathname.split('/').filter(Boolean).slice(-2).join(' ').slice(0,28);}catch(e){return u;}};
  function use(u){
    w.data.url=u;
    w.data.recent=[u,...(w.data.recent||[]).filter(x=>x!==u)].slice(0,5);
    editing=false;save();draw();
  }
  function draw(){
    const src=w.data.url&&embedURL(w.data.url);
    changeB.hidden=!src||editing;
    if(src&&!editing){
      body.replaceChildren(h('iframe',{class:'music-frame',src,title:'Music player',loading:'lazy',
        allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture',allowfullscreen:true,referrerpolicy:'strict-origin-when-cross-origin'}));
      return;
    }
    const fld=h('input',{class:'fld',placeholder:'Paste a Spotify or YouTube link','aria-label':'Spotify or YouTube link'});
    const err=h('div',{class:'cl-count'});
    const go=()=>{
      if(!embedURL(fld.value)){err.textContent='That link did not work. Use Share, then Copy link, in Spotify or YouTube.';return;}
      use(fld.value.trim());
    };
    fld.addEventListener('keydown',e=>{if(e.key==='Enter')go();if(e.key==='Escape'&&src){e.stopPropagation();editing=false;draw();}});
    fld.addEventListener('paste',()=>setTimeout(()=>{if(embedURL(fld.value))go();},0));
    const recent=(w.data.recent||[]).filter(u=>u!==w.data.url||!src);
    body.replaceChildren(h('div',{class:'dz'},
      h('div',null,'Paste a link to a song, playlist, album, or video.'),
      fld,
      h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:go},'Play'),
        src?h('button',{class:'btn',type:'button',onclick:()=>{editing=false;draw();}},'Back to what was playing'):null),
      err,
      recent.length?h('div',{class:'pk-chips'},h('span',{class:'cl-count'},'Recent:'),
        recent.map(u=>h('button',{class:'chip',type:'button',title:u,onclick:()=>use(u)},label(u)))):null));
    if(editing) setTimeout(()=>fld.focus(),0);
  }
  draw();
}

/* ---------- Agenda ---------- */
function buildAgenda(w,body,tools){
  const D=w.data;
  const title=h('input',{class:'ag-title',value:D.title||'','aria-label':'Agenda title'});
  title.addEventListener('input',()=>{D.title=title.value;save();});
  const list=h('div',{class:'ag-list'});
  body.append(title,list);
  function row(it){
    const chk=h('button',{class:'ag-chk'+(it.done?' on':''),type:'button',title:'Mark done','aria-label':'Mark done','aria-pressed':String(!!it.done)});
    const tm=h('input',{class:'ag-time',type:'time',value:it.t||'','aria-label':'Start time'});
    const tx=h('input',{class:'ag-txt',value:it.txt||'',placeholder:'Activity','aria-label':'Activity'});
    const rm=h('button',{class:'ag-rm',type:'button',title:'Delete row','aria-label':'Delete row'},'×');
    const r=h('div',{class:'ag-row'+(it.done?' done':'')},chk,tm,tx,rm);
    chk.addEventListener('click',()=>{it.done=!it.done;chk.classList.toggle('on',it.done);chk.setAttribute('aria-pressed',String(it.done));r.classList.toggle('done',it.done);save();});
    tm.addEventListener('input',()=>{it.t=tm.value;save();mark();});
    tx.addEventListener('input',()=>{it.txt=tx.value;save();});
    rm.addEventListener('click',()=>{D.items=D.items.filter(i=>i!==it);r.remove();save();mark();});
    r._it=it;r._tx=tx;
    return r;
  }
  function drawList(){list.replaceChildren(...D.items.map(row));mark();}
  function mark(){
    const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
    let best=null;
    [...list.children].forEach(r=>{r.classList.remove('now');if(r._it.t&&r._it.t<=hm&&(!best||r._it.t>=best._it.t))best=r;});
    if(best) best.classList.add('now');
    /* Present mode shows only the current row and the next two. Before the first start time, it shows the first three. */
    const rows=[...list.children],i=best?rows.indexOf(best):0;
    rows.forEach((r,k)=>r.classList.toggle('out',k<i||k>i+2));
  }
  tools.append(
    tbtn('+ Row','Add a row',()=>{
      const it={id:uid(),t:'',txt:'',done:false};D.items.push(it);
      const r=row(it);list.append(r);r._tx.focus();r.scrollIntoView({block:'nearest'});save();
    }),
    tbtn('Sort','Sort rows by time',()=>{
      D.items.sort((a,b)=>(a.t||'99:99').localeCompare(b.t||'99:99'));drawList();save();
    })
  );
  drawList();ticks.push(mark);
}

/* ---------- Task steps ---------- */
/* Five steps at most. The first unchecked step is the current one and shows in bold.
   Checked steps get a check mark and a strikethrough but keep full contrast, so they stay readable. */
const MAX_STEPS=5;
const ICON_CHECK='<svg viewBox="0 0 24 24" width="70%" height="70%" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function buildSteps(w,body,tools){
  const D=w.data;
  const title=h('input',{class:'ag-title',value:D.title||'','aria-label':'Checklist title'});
  title.addEventListener('input',()=>{D.title=title.value;save();});
  const list=h('ol',{class:'st-list'});
  body.append(title,list);
  const addB=tbtn('+ Step','Add a step',()=>{
    if(D.items.length>=MAX_STEPS)return;
    const it={id:uid(),txt:'',done:false};D.items.push(it);save();draw();
    const r=list.lastChild;if(r)r._tx.focus();
  });
  tools.append(addB,tbtn('Reset','Uncheck every step',()=>{D.items.forEach(i=>{i.done=false;});save();draw();}));
  function draw(){
    const cur=D.items.find(i=>!i.done);
    list.replaceChildren(...D.items.map((it,k)=>{
      const chk=h('button',{class:'st-chk'+(it.done?' on':''),type:'button','aria-label':'Step '+(k+1)+' done','aria-pressed':String(!!it.done)});
      if(it.done) chk.innerHTML=ICON_CHECK;
      const tx=h('input',{class:'st-txt',value:it.txt||'',placeholder:'Step '+(k+1),'aria-label':'Step '+(k+1)});
      const rm=h('button',{class:'ag-rm st-rm',type:'button',title:'Delete step','aria-label':'Delete step'},'\u00d7');
      const r=h('li',{class:'st-row'+(it.done?' done':'')+(it===cur?' cur':'')},h('span',{class:'st-n'},String(k+1)),chk,tx,rm);
      chk.addEventListener('click',()=>{it.done=!it.done;save();draw();});
      tx.addEventListener('input',()=>{it.txt=tx.value;save();});
      rm.addEventListener('click',()=>{D.items=D.items.filter(i=>i!==it);save();draw();});
      r._tx=tx;
      return r;
    }));
    addB.disabled=D.items.length>=MAX_STEPS;
    addB.title=addB.disabled?'Five steps is the most':'Add a step';
  }
  draw();
}

/* ---------- Seating chart ---------- */
/* Furniture is shared by every class. Each class keeps its own seat assignments in D.seats[classId] = {chairId: name}. */
function buildSeats(w,body,tools){
  const D=w.data;D.items=D.items||[];D.seats=D.seats||{};
  let arrange=!D.items.length,pick=null;
  const getClass=()=>S.classes.find(c=>c.id===D.classId)||null;
  const seatMap=()=>{const c=getClass();return c?(D.seats[c.id]||(D.seats[c.id]={})):{};};
  const show=n=>D.initials?n.split(/\s+/).filter(Boolean).map(p=>p[0]).join('').toUpperCase():n;
  const clsSel=h('select',{class:'sel','aria-label':'Class'});
  clsSel.addEventListener('change',()=>{
    if(clsSel.value==='__edit'){const c=getClass();clsSel.value=c?c.id:'__edit';openClasses(c&&c.id);return;}
    D.classId=clsSel.value;pick=null;save();draw();
  });
  const hint=h('span',{class:'seat-hint'});
  const canvas=h('div',{class:'seat-canvas'});
  const tray=h('div',{class:'seat-tray','aria-label':'Students without a seat'});
  body.append(h('div',{class:'seat-top'},clsSel,hint),canvas,tray);
  const add=(kind)=>{
    const n=D.items.length,big=kind==='table';
    const it={id:uid(),kind,w:big?.22:.09,h:big?.16:.11,label:''};
    it.x=clamp(.36+(n%6)*.03,0,1-it.w);it.y=clamp(.3+(n%6)*.04,0,1-it.h);
    D.items.push(it);save();draw();
  };
  const addT=tbtn('+ Table','Add a table',()=>add('table'));
  const addC=tbtn('+ Chair','Add a chair',()=>add('chair'));
  const clearB=tbtn('Clear','Unseat everyone in this class',null);
  armed(clearB,'Clear',()=>{const c=getClass();if(c)D.seats[c.id]={};pick=null;save();draw();},'Unseat all?');
  tools.append(
    tog('Arrange','Add, move, or remove tables and chairs',()=>arrange,v=>{arrange=v;pick=null;draw();}),
    addT,addC,
    tog('Initials','Show initials instead of names',()=>!!D.initials,v=>{D.initials=v;draw();}),
    clearB);

  function seat(name,chairId,from){
    const m=seatMap();
    if(chairId){
      const old=m[chairId];
      if(from) {if(old&&old!==name)m[from]=old;else delete m[from];}
      Object.keys(m).forEach(k=>{if(m[k]===name&&k!==chairId)delete m[k];});
      m[chairId]=name;
    }else if(from) delete m[from];
    pick=null;save();draw();
  }
  /* A name can be dragged, or clicked and then a chair clicked. */
  function nameDown(e,name,from){
    if(arrange||presenting||e.button>0)return;
    e.preventDefault();e.stopPropagation();
    const sx=e.clientX,sy=e.clientY;let ghost=null;
    const src=e.currentTarget;src.setPointerCapture(e.pointerId);
    const mv=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!ghost){ghost=h('div',{class:'seat-ghost'},show(name));document.body.append(ghost);}
      ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';
    };
    const up=ev=>{
      src.removeEventListener('pointermove',mv);src.removeEventListener('pointerup',up);src.removeEventListener('pointercancel',up);
      if(!ghost){pick=(pick&&pick.name===name)?null:{name,from};draw();return;}
      ghost.remove();
      if(ev.type==='pointercancel')return;
      const t=document.elementFromPoint(ev.clientX,ev.clientY);
      const chair=t&&t.closest('.seat-chair');
      if(chair&&canvas.contains(chair)) seat(name,chair.dataset.id,from);
      else if(t&&tray.contains(t)) seat(name,null,from);
    };
    src.addEventListener('pointermove',mv);src.addEventListener('pointerup',up);src.addEventListener('pointercancel',up);
  }
  function moveDown(e,it,el,resize){
    if(!arrange||presenting||e.button>0||(!resize&&e.target.closest('input,button,.seat-rs')))return;
    e.preventDefault();e.stopPropagation();
    const r=canvas.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,o={x:it.x,y:it.y,w:it.w,h:it.h};
    const src=e.currentTarget;src.setPointerCapture(e.pointerId);
    const mv=ev=>{
      const dx=(ev.clientX-sx)/r.width,dy=(ev.clientY-sy)/r.height;
      if(resize){it.w=clamp(o.w+dx,.05,1-it.x);it.h=clamp(o.h+dy,.05,1-it.y);}
      else{it.x=clamp(o.x+dx,0,1-it.w);it.y=clamp(o.y+dy,0,1-it.h);}
      placeItem(el,it);
    };
    const up=()=>{src.removeEventListener('pointermove',mv);src.removeEventListener('pointerup',up);src.removeEventListener('pointercancel',up);save();};
    src.addEventListener('pointermove',mv);src.addEventListener('pointerup',up);src.addEventListener('pointercancel',up);
  }
  /* Spaces n chairs evenly along the table's two long sides, just outside its edges. */
  function around(t,n){
    const r=canvas.getBoundingClientRect(),wide=t.w*r.width>=t.h*r.height;
    const cw=Math.min(.09,72/r.width),ch=Math.min(.11,60/r.height),gx=12/r.width,gy=8/r.height;
    const a=Math.ceil(n/2),b=n-a;
    const side=(count,first)=>{
      /* Chairs shrink so they fit along the side without touching. */
      const w2=wide?Math.min(cw,t.w/count-gx):cw,h2=wide?ch:Math.min(ch,t.h/count-gy);
      for(let i=0;i<count;i++){
        const f=(i+.5)/count,c={id:uid(),kind:'chair',w:w2,h:h2,label:''},cw=w2,ch=h2;
        if(wide){c.x=t.x+t.w*f-cw/2;c.y=first?t.y-ch-gy:t.y+t.h+gy;}
        else{c.y=t.y+t.h*f-ch/2;c.x=first?t.x-cw-gx:t.x+t.w+gx;}
        c.x=clamp(c.x,0,1-cw);c.y=clamp(c.y,0,1-ch);
        D.items.push(c);
      }
    };
    side(a,true);side(b,false);save();draw();
  }
  function placeItem(el,it){el.style.left=it.x*100+'%';el.style.top=it.y*100+'%';el.style.width=it.w*100+'%';el.style.height=it.h*100+'%';}
  function itemEl(it,m){
    const el=h('div',{class:'seat-item seat-'+it.kind,'data-id':it.id});
    placeItem(el,it);
    if(it.kind==='table'){
      const lb=h('input',{class:'seat-label',value:it.label||'',placeholder:arrange?'Table':'','aria-label':'Table label'});
      lb.addEventListener('input',()=>{it.label=lb.value;save();});
      const ar=h('button',{class:'chip seat-around',type:'button',title:'Add chairs around this table'},'+ Chairs');
      ar.addEventListener('click',()=>openPop(ar,box=>box.append(h('h3',null,'Chairs around this table'),
        h('div',{class:'pk-chips'},[2,4,6,8].map(n=>h('button',{class:'chip',type:'button',onclick:()=>{closePop();around(it,n);}},String(n)))))));
      el.append(lb,ar);
    }else{
      const name=m[it.id];
      el.classList.toggle('empty',!name);
      if(name){
        const nm=h('span',{class:'seat-name'+(pick&&pick.name===name?' seat-sel':''),title:name},show(name));
        nm.addEventListener('pointerdown',e=>nameDown(e,name,it.id));
        el.append(nm);
      }
      el.addEventListener('click',()=>{if(!arrange&&pick&&!name)seat(pick.name,it.id,pick.from);else if(!arrange&&pick&&name&&pick.name!==name)seat(pick.name,it.id,pick.from);});
    }
    const x=h('button',{class:'seat-x',type:'button',title:'Remove','aria-label':'Remove'},'×');
    x.addEventListener('click',()=>{
      D.items=D.items.filter(i=>i!==it);
      Object.values(D.seats).forEach(m=>{delete m[it.id];});
      save();draw();
    });
    const rs=h('div',{class:'seat-rs',title:'Resize'});
    rs.addEventListener('pointerdown',e=>moveDown(e,it,el,true));
    el.addEventListener('pointerdown',e=>moveDown(e,it,el,false));
    el.append(x,rs);
    return el;
  }
  function draw(){
    const cls=getClass();
    clsSel.replaceChildren(...S.classes.map(c=>h('option',{value:c.id},c.name||'Untitled class')),
      h('option',{value:'__edit'},S.classes.length?'Edit classes...':'Add a class...'));
    clsSel.value=cls?cls.id:'__edit';
    const m=seatMap(),ids=new Set(D.items.filter(i=>i.kind==='chair').map(i=>i.id));
    if(cls) Object.keys(m).forEach(k=>{if(!ids.has(k)||!cls.students.includes(m[k]))delete m[k];});
    body.classList.toggle('arranging',arrange);
    addT.hidden=addC.hidden=!arrange;
    canvas.replaceChildren(h('div',{class:'seat-front'},'Front of room'),...D.items.map(it=>itemEl(it,m)));
    const seated=new Set(Object.values(m));
    if(!cls){
      hint.textContent='';
      tray.replaceChildren(h('span',{class:'seat-hint'},'Add a class to seat students.'),h('button',{class:'btn',type:'button',onclick:()=>openClasses()},'Add a class'));
    }else if(arrange){
      hint.textContent=D.items.length?'Drag to move. Drag a corner to resize a table.':'Add tables and chairs to match your room.';
      tray.replaceChildren(h('span',{class:'seat-hint'},'Turn off Arrange to seat students.'));
    }else{
      const left=cls.students.filter(n=>!seated.has(n));
      hint.textContent=pick?'Now click a chair for '+pick.name+'.':'Drag a name onto a chair, or click a name, then a chair.';
      tray.replaceChildren(...(left.length?left.map(n=>{
        const c=h('button',{class:'chip'+(pick&&pick.name===n?' seat-sel':''),type:'button',title:n},show(n));
        c.addEventListener('pointerdown',e=>nameDown(e,n,null));
        return c;
      }):[h('span',{class:'seat-hint'},'Everyone has a seat.')]));
    }
  }
  tray.addEventListener('click',e=>{if(pick&&pick.from&&e.target===tray)seat(pick.name,null,pick.from);});
  classHooks.push(()=>{if(!getClass())D.classId=S.classes[0]?S.classes[0].id:null;draw();});
  draw();
}

/* ---------- Names, partners, groups ---------- */
function buildPicker(w,body,tools,el){
  const D=w.data;
  const getClass=()=>S.classes.find(c=>c.id===D.classId)||null;
  const present=()=>{const c=getClass();return c?c.students.filter(s=>!c.absent.includes(s)):[];};
  const sel=h('select',{class:'sel','aria-label':'Class'});
  sel.addEventListener('change',()=>{
    if(sel.value==='__edit'){const c=getClass();sel.value=c?c.id:'__edit';openClasses(c&&c.id);return;}
    D.classId=sel.value;D.used=[];D.result=null;save();draw();
  });
  const seg=h('div',{class:'seg',role:'group','aria-label':'Mode'},
    [['one','Name'],['pairs','Partners'],['groups','Groups']].map(([k,l])=>
      h('button',{type:'button','data-k':k,onclick:()=>{D.mode=k;D.result=null;save();draw();}},l)));
  const sizeVal=h('b',null,String(D.size));
  const step=d=>{D.size=clamp(D.size+d,2,10);D.result=null;save();draw();};
  const sizeBox=h('div',{class:'size'},h('span',null,'Size'),
    h('button',{class:'chip',type:'button','aria-label':'Smaller groups',onclick:()=>step(-1)},'-'),sizeVal,
    h('button',{class:'chip',type:'button','aria-label':'Larger groups',onclick:()=>step(1)},'+'));
  const out=h('div',{class:'pk-out'});
  const go=h('button',{class:'btn primary big',type:'button'},'Pick a name');
  const info=h('span',{class:'pk-info'});
  const here=h('button',{class:'btn',type:'button'},'Who is here');
  const panel=h('div',{class:'pk-here',hidden:true});
  body.append(h('div',{class:'pk-top'},sel,seg,sizeBox),out,h('div',{class:'pk-bot'},go,info,here),panel);

  function pickOne(){
    const pool=present();if(!pool.length)return;
    let left=pool.filter(s=>!D.used.includes(s)),wrapped=false;
    if(!left.length){D.used=[];left=pool.slice();wrapped=true;}
    const final=left[Math.floor(Math.random()*left.length)];
    const finish=()=>{D.used.push(final);D.result=final;save();go.disabled=false;draw();if(wrapped)toast('Everyone has been picked. Starting a new round.');};
    if(reduce||S.calm){finish();return;}
    const nameEl=h('div',{class:'pk-name'});
    out.replaceChildren(nameEl);go.disabled=true;
    let i=0;
    const iv=setInterval(()=>{
      nameEl.textContent=i<13?pool[Math.floor(Math.random()*pool.length)]:final;
      if(++i>14){clearInterval(iv);finish();}
    },75);
  }
  function makeGroups(){
    const pool=shuffle(present());const n=pool.length;if(!n)return;
    const k=D.mode==='pairs'?Math.max(1,Math.floor(n/2)):Math.max(1,Math.ceil(n/D.size));
    const g=Array.from({length:k},()=>[]);
    pool.forEach((s,i)=>g[i%k].push(s));
    D.result=g;save();draw();
  }
  go.addEventListener('click',()=>{D.mode==='one'?pickOne():makeGroups();});

  function openHere(){
    const c=getClass();if(!c)return;
    const done=h('button',{class:'btn primary',type:'button',onclick:()=>{
      panel.hidden=true;D.used=D.used.filter(s=>!c.absent.includes(s));D.result=null;save();draw();
    }},'Done');
    const chips=h('div',{class:'pk-chips'},c.students.map(s=>{
      const b=h('button',{class:'chip'+(c.absent.includes(s)?' off':''),type:'button','aria-pressed':String(!c.absent.includes(s))},s);
      b.addEventListener('click',()=>{
        const i=c.absent.indexOf(s);
        if(i>=0)c.absent.splice(i,1);else c.absent.push(s);
        b.classList.toggle('off',c.absent.includes(s));b.setAttribute('aria-pressed',String(!c.absent.includes(s)));
        save();
      });
      return b;
    }));
    panel.replaceChildren(h('div',{class:'ph'},h('span',null,'Who is here? Tap a name to mark absent.'),done),chips);
    panel.hidden=false;
  }
  here.addEventListener('click',openHere);

  function draw(){
    const cls=getClass();
    sel.replaceChildren(...S.classes.map(c=>h('option',{value:c.id},c.name||'Untitled class')),
      h('option',{value:'__edit'},S.classes.length?'Edit classes...':'Add a class...'));
    sel.value=cls?cls.id:'__edit';
    seg.querySelectorAll('button').forEach(b=>{const on=b.dataset.k===D.mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
    sizeBox.hidden=D.mode!=='groups';
    sizeVal.textContent=D.size;
    const pool=present(),total=cls?cls.students.length:0;
    here.textContent='Who is here ('+pool.length+'/'+total+')';
    here.disabled=!cls;
    info.replaceChildren();
    if(!cls){
      out.replaceChildren(h('div',{class:'pk-empty'},h('span',null,'Add a class to get started.'),h('button',{class:'btn',type:'button',onclick:()=>openClasses()},'Add a class')));
      go.disabled=true;return;
    }
    if(!pool.length){
      out.replaceChildren(h('div',{class:'pk-empty'},h('span',null,total?'Everyone is marked absent.':'This class has no students yet.'),h('button',{class:'btn',type:'button',onclick:()=>openClasses(cls.id)},'Edit class')));
      go.disabled=true;return;
    }
    go.disabled=false;
    if(D.mode==='one'){
      go.textContent='Pick a name';
      const left=pool.filter(s=>!D.used.includes(s)).length;
      info.append(left+' of '+pool.length+' left in this round');
      if(D.used.length) info.append(' ',h('button',{class:'lnk',type:'button',onclick:()=>{D.used=[];D.result=null;save();draw();}},'Start over'));
      out.replaceChildren(typeof D.result==='string'?h('div',{class:'pk-name'},D.result):h('div',{class:'pk-hint'},'Press Pick a name.'));
    }else{
      go.textContent=Array.isArray(D.result)?'Shuffle again':(D.mode==='pairs'?'Make partners':'Make groups');
      info.append(D.mode==='pairs'?(pool.length%2?'Pairs, plus one trio':'Pairs'):Math.max(1,Math.ceil(pool.length/D.size))+' groups of up to '+D.size);
      if(Array.isArray(D.result)){
        out.replaceChildren(h('div',{class:'pk-grid'},D.result.map((g,i)=>{
          const label=D.mode==='pairs'?(g.length===2?'Pair':g.length===3?'Trio':'Solo'):'Group';
          return h('div',{class:'pk-card'},h('div',{class:'pk-ch'},label+' '+(i+1)),h('ul',null,g.map(n=>h('li',null,n))));
        })));
      }else{
        out.replaceChildren(h('div',{class:'pk-hint'},'Press '+go.textContent+'.'));
      }
    }
  }
  classHooks.push(()=>{
    if(!getClass()){D.classId=S.classes[0]?S.classes[0].id:null;D.result=null;D.used=[];}
    const c=getClass();if(c)D.used=D.used.filter(s=>c.students.includes(s));
    draw();
  });
  draw();
}

function openPop(anchor,fill){

function downloadBackup(){
  clearTimeout(saveT);flush();
  const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const blob=new Blob([JSON.stringify({app:'classboard',v:1,saved:d.toISOString(),data:S})],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:'Classboard backup '+day+'.json'});
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Backup downloaded. Keep it somewhere safe, like Google Drive.');
}
function readBackup(f){
  return f.text().then(txt=>{
    const j=JSON.parse(txt);
    const D=j&&j.app==='classboard'&&j.data?j.data:j;
    if(!D||!Array.isArray(D.screens)||!D.screens.length) throw new Error('bad');
    return normalize(D);
  });
}
function backupPop(anchor){
  openPop(anchor,box=>{

    const main=()=>box.replaceChildren(
      h('h3',null,'Backup'),
      h('p',null,'Saves every screen, widget, image, and class list to one file.'),
      h('button',{class:'btn primary',type:'button',onclick:downloadBackup},'Download backup'),
      h('button',{class:'btn',type:'button',onclick:()=>file.click()},'Import backup'),
      file);
    file.addEventListener('change',()=>{
      const f=file.files[0];file.value='';if(!f)return;
      readBackup(f).then(D=>{
        const n=(k,one,many)=>k+' '+(k===1?one:many);
        const go=h('button',{class:'btn danger',type:'button',onclick:()=>{
          S=D;Object.keys(RT).forEach(k=>delete RT[k]);
          closePop();syncBrand();document.body.classList.toggle('calm',!!S.calm);renderTabs();renderBoard();
          clearTimeout(saveT);
          if(flush()) toast('Backup imported.');
        }},'Replace my boards');
        box.replaceChildren(
          h('h3',null,'Import backup'),
          h('p',null,'This file has '+n(D.screens.length,'screen','screens')+' and '+n(D.classes.length,'class','classes')+'.'),

}

/* ---------- Floating clock and timer (Document Picture-in-Picture, Chrome and Edge) ---------- */
/* Dial faces: [minutes on the face, minutes between labels]. The smallest face that fits the timer is used. */
const FACES=[[5,1],[10,2],[15,5],[20,5],[30,5],[60,5],[90,15],[120,15]];
function dialSVG(left,dur,c){
  const [max,step]=FACES.find(f=>f[0]>=dur/60)||FACES[FACES.length-1];
  const P=(r,m)=>{const a=m/max*2*Math.PI;return [(100+r*Math.sin(a)).toFixed(2),(100-r*Math.cos(a)).toFixed(2)];};
  let s='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time left">';
  for(let m=0;m<max;m+=max<=60?1:5){
    const big=m%step===0,[x1,y1]=P(big?70:74,m),[x2,y2]=P(79,m);
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c.ink+'" stroke-width="'+(big?2:1)+'" stroke-linecap="round"/>';
  }
  for(let m=0;m<max;m+=step){const [x,y]=P(90,m);s+='<text x="'+x+'" y="'+y+'" font-size="11" text-anchor="middle" dominant-baseline="central" fill="'+c.ink+'">'+m+'</text>';}
  const f=clamp(left/(max*60),0,1),R=64;
  s+='<circle cx="100" cy="100" r="'+R+'" fill="'+c.soft+'"/>';
  if(f>.9999) s+='<circle cx="100" cy="100" r="'+R+'" fill="'+c.accent+'"/>';
  else if(f>0){const [x,y]=P(R,f*max);s+='<path d="M100 100 L100 '+(100-R)+' A'+R+' '+R+' 0 '+(f>.5?1:0)+' 1 '+x+' '+y+' Z" fill="'+c.accent+'"/>';}
  const txt=c.done?'Time is up':fmtTime(left);
  s+='<circle cx="100" cy="100" r="38" fill="'+c.panel+'"/>';
  s+='<text x="100" y="101" font-size="'+(c.done?13:txt.length>5?16:21)+'" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="'+c.ink+'" style="font-variant-numeric:tabular-nums">'+txt+'</text>';
  return s+'</svg>';
}
const ICON_PLAY='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';

  /* The timer shown is the one started most recently, else the first on this screen. */
  const pick=()=>{const all=S.screens.flatMap(s=>s.widgets).filter(w=>w.type==='timer');return all.find(w=>w.id===lastTimer)||cur().widgets.find(w=>w.type==='timer')||all[0]||null;};
  const rtOf=w=>RT[w.id]||(RT[w.id]={running:false,endAt:0,left:w.data.dur,done:false});
  play.addEventListener('click',()=>{
    const w=pick();if(!w)return;const rt=rtOf(w);
    if(rt.toggle){rt.toggle();}
    else if(rt.running){rt.left=Math.max(0,(rt.endAt-Date.now())/1000);rt.running=false;}
    else{ensureAudio();if(rt.done||rt.left<=0)rt.left=w.data.dur;rt.done=false;rt.endAt=Date.now()+rt.left*1000;rt.running=true;lastTimer=w.id;}
    draw();
  });
  let lastSvg='',lastPlay='';
  const draw=()=>{
    const n=new Date(),h24=cw&&cw.data.h24;
    let hh=n.getHours(),ap='';
    if(!h24){ap=hh>=12?'PM':'AM';hh=hh%12||12;}else hh=String(hh).padStart(2,'0');
    t.replaceChildren(hh+':'+String(n.getMinutes()).padStart(2,'0'),ap?h('span',{class:'ampm'},ap):'');
    const w=pick();
    d.body.classList.toggle('clockonly',!w);
    if(!w){d.body.classList.remove('done');return;}
    const rt=rtOf(w);
    let left=rt.running?(rt.endAt-Date.now())/1000:rt.left;
    /* If the timer's screen is not showing, the board cannot ring the bell, so ring it here. */
    if(rt.running&&left<=0&&!boardEl.querySelector('[data-id="'+w.id+'"]')){rt.running=false;rt.left=0;rt.done=true;if(w.data.bell)beep();}
    if(rt.done) left=0;
    d.body.classList.toggle('done',!!rt.done);
    const svg=dialSVG(left,w.data.dur,Object.assign({done:rt.done},c,rt.done?{ink:v('--on-sun'),panel:v('--sun')}:{}));
    if(svg!==lastSvg){dial.innerHTML=svg;lastSvg=svg;}
    const pl=rt.running?'pause':'play';
    if(pl!==lastPlay){play.innerHTML=rt.running?ICON_PAUSE:ICON_PLAY;play.setAttribute('aria-label',rt.running?'Pause timer':'Start timer');lastPlay=pl;}
  };
  draw();
  const iv=setInterval(draw,250);
  $('#bFloat').textContent='Close float';
  pipWin.addEventListener('pagehide',()=>{clearInterval(iv);pipWin=null;$('#bFloat').textContent='Float clock';});
}

/* ---------- Screens ---------- */
const tabsEl=$('#tabs');
function renderTabs(){
  tabsEl.replaceChildren(...S.screens.map(sc=>
    h('button',{class:'tab'+(sc.id===S.active?' on':''),type:'button','aria-pressed':String(sc.id===S.active),onclick:()=>switchTo(sc.id)},sc.name||'Untitled')),
    h('button',{class:'tab add',type:'button',title:'New screen','aria-label':'New screen',onclick:()=>{
      const sc={id:uid(),name:'Screen '+(S.screens.length+1),bg:cur().bg,widgets:guideWidgets()};
      S.screens.push(sc);switchTo(sc.id);
    }},'+'));
  const on=$('.tab.on',tabsEl);if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});
  syncPbar();
}
function switchTo(id){S.active=id;save();renderTabs();renderBoard();}
function go(d){
  const i=S.screens.findIndex(s=>s.id===S.active);
  switchTo(S.screens[(i+d+S.screens.length)%S.screens.length].id);
}

/* ---------- Present mode ---------- */
let presenting=false,fsOn=false;
function syncPbar(){
  $('#pName').textContent=cur().name||'Untitled';
  $('#pPrev').disabled=$('#pNext').disabled=S.screens.length<2;
}
/* The present bar shows fully on entering Present mode and on mouse movement, then fades after 3 seconds. */
let wakeT=null;
function wakePbar(){
  if(!presenting)return;
  const b=$('#pbar');b.classList.add('wake');
  clearTimeout(wakeT);wakeT=setTimeout(()=>b.classList.remove('wake'),3000);
}
document.addEventListener('pointermove',wakePbar);
function setPresent(on){
  presenting=on;document.body.classList.toggle('present',on);closePop();
  if(on){
    try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  }else if(document.fullscreenElement){
    try{document.exitFullscreen();}catch(e){}
  }
  syncPbar();
  if(on)wakePbar();
}
document.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement)fsOn=true;
  else if(fsOn){fsOn=false;if(presenting)setPresent(false);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(popEl){closePop();return;}
    if(presenting)setPresent(false);
    return;
  }
  if(!presenting)return;
  const t=e.target;
  if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});

/* Dropping a file outside an image widget should not navigate away. */
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>{
  if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();
}));

/* ---------- Toolbar wiring ---------- */
$('#bAdd').addEventListener('click',e=>addPop(e.currentTarget));
$('#bGear').addEventListener('click',e=>gearPop(e.currentTarget));
$('#bFloat').addEventListener('click',floatClock);
$('#bPresent').addEventListener('click',()=>setPresent(true));
$('#pPrev').addEventListener('click',()=>go(-1));
$('#pNext').addEventListener('click',()=>go(1));
$('#pExit').addEventListener('click',()=>setPresent(false));
$('#pCalm').addEventListener('click',()=>setCalm(!S.calm));

syncBrand();
if(S.calm){document.body.classList.add('calm');$('#pCalm').classList.add('primary');$('#pCalm').setAttribute('aria-pressed','true');}
renderTabs();
renderBoard();
})();
</script>
