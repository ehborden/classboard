/* ---------- Names, partners, groups ---------- */
function buildPicker(w,body,tools,el){
  const D=w.data;
  const getClass=()=>S.classes.find(c=>c.id===D.classId)||null;
  const present=()=>{const c=getClass();return c?c.students.filter(s=>!c.absent.includes(s)):[];};
  const sel=h('select',{class:'sel','aria-label':'Class'});
  sel.addEventListener('change',()=>{
    if(sel.value==='__edit'){const c=getClass();sel.value=c?c.id:'__edit';openClasses(c&&c.id);return;}
    D.classId=sel.value;D.used=[];D.result=null;save();draw();
  });
  const seg=h('div',{class:'seg',role:'group','aria-label':'Mode'},
    [['one','Name'],['pairs','Partners'],['groups','Groups']].map(([k,l])=>
      h('button',{type:'button','data-k':k,onclick:()=>{D.mode=k;D.result=null;save();draw();}},l)));
  const sizeVal=h('b',null,String(D.size));
  const step=d=>{D.size=clamp(D.size+d,2,10);D.result=null;save();draw();};
  const sizeBox=h('div',{class:'size'},h('span',null,'Size'),
    h('button',{class:'chip',type:'button','aria-label':'Smaller groups',onclick:()=>step(-1)},'-'),sizeVal,
    h('button',{class:'chip',type:'button','aria-label':'Larger groups',onclick:()=>step(1)},'+'));
  const out=h('div',{class:'pk-out'});
  const go=h('button',{class:'btn primary big',type:'button'},'Pick a name');
  const info=h('span',{class:'pk-info'});
  const here=h('button',{class:'btn',type:'button'},'Who is here');
  const panel=h('div',{class:'pk-here',hidden:true});
  const editB=h('button',{class:'btn',type:'button',onclick:()=>{const c=getClass();openClasses(c&&c.id);}},'Edit class');
  body.append(h('div',{class:'pk-top'},sel,editB,seg,sizeBox),out,h('div',{class:'pk-bot'},go,info,here),panel);

  function pickOne(){
    const pool=present();if(!pool.length)return;
    let left=pool.filter(s=>!D.used.includes(s)),wrapped=false;
    if(!left.length){D.used=[];left=pool.slice();wrapped=true;}
    const final=left[Math.floor(Math.random()*left.length)];
    const finish=()=>{D.used.push(final);D.result=final;save();go.disabled=false;draw();if(wrapped)toast('Everyone has been picked. Starting a new round.');};
    if(reduce||S.calm){finish();return;}
    const nameEl=h('div',{class:'pk-name'});
    out.replaceChildren(nameEl);go.disabled=true;
    let i=0;
    const iv=setInterval(()=>{
      nameEl.textContent=i<13?pool[Math.floor(Math.random()*pool.length)]:final;
      if(++i>14){clearInterval(iv);finish();}
    },75);
  }
  function makeGroups(){
    const pool=shuffle(present());const n=pool.length;if(!n)return;
    const k=D.mode==='pairs'?Math.max(1,Math.floor(n/2)):Math.max(1,Math.ceil(n/D.size));
    const g=Array.from({length:k},()=>[]);
    pool.forEach((s,i)=>g[i%k].push(s));
    D.result=g;save();draw();
  }
  go.addEventListener('click',()=>{D.mode==='one'?pickOne():makeGroups();});

  function openHere(){
    const c=getClass();if(!c)return;
    const done=h('button',{class:'btn primary',type:'button',onclick:()=>{
      panel.hidden=true;D.used=D.used.filter(s=>!c.absent.includes(s));D.result=null;save();draw();
    }},'Done');
    const chips=h('div',{class:'pk-chips'},c.students.map(s=>{
      const b=h('button',{class:'chip'+(c.absent.includes(s)?' off':''),type:'button','aria-pressed':String(!c.absent.includes(s))},s);
      b.addEventListener('click',()=>{
        const i=c.absent.indexOf(s);
        if(i>=0)c.absent.splice(i,1);else c.absent.push(s);
        b.classList.toggle('off',c.absent.includes(s));b.setAttribute('aria-pressed',String(!c.absent.includes(s)));
        save();
      });
      return b;
    }));
    panel.replaceChildren(h('div',{class:'ph'},h('span',null,'Who is here? Tap a name to mark absent.'),done),chips);
    panel.hidden=false;
  }
  here.addEventListener('click',openHere);

  function draw(){
    const cls=getClass();
    sel.replaceChildren(...S.classes.map(c=>h('option',{value:c.id},c.name||'Untitled class')),
      h('option',{value:'__edit'},S.classes.length?'Edit classes...':'Add a class...'));
    sel.value=cls?cls.id:'__edit';
    seg.querySelectorAll('button').forEach(b=>{const on=b.dataset.k===D.mode;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});
    sizeBox.hidden=D.mode!=='groups';
    sizeVal.textContent=D.size;
    const pool=present(),total=cls?cls.students.length:0;
    here.textContent='Who is here ('+pool.length+'/'+total+')';
    here.disabled=!cls;
    info.replaceChildren();
    if(!cls){
      out.replaceChildren(h('div',{class:'pk-empty'},h('span',null,'Add a class to get started.'),h('button',{class:'btn',type:'button',onclick:()=>openClasses()},'Add a class')));
      go.disabled=true;return;
    }
    if(!pool.length){
      out.replaceChildren(h('div',{class:'pk-empty'},h('span',null,total?'Everyone is marked absent.':'This class has no students yet.'),h('button',{class:'btn',type:'button',onclick:()=>openClasses(cls.id)},'Edit class')));
      go.disabled=true;return;
    }
    go.disabled=false;
    if(D.mode==='one'){
      go.textContent='Pick a name';
      const left=pool.filter(s=>!D.used.includes(s)).length;
      info.append(left+' of '+pool.length+' left in this round');
      if(D.used.length) info.append(' ',h('button',{class:'lnk',type:'button',onclick:()=>{D.used=[];D.result=null;save();draw();}},'Start over'));
      out.replaceChildren(typeof D.result==='string'?h('div',{class:'pk-name'},D.result):h('div',{class:'pk-hint'},'Press Pick a name.'));
    }else{
      go.textContent=Array.isArray(D.result)?'Shuffle again':(D.mode==='pairs'?'Make partners':'Make groups');
      info.append(D.mode==='pairs'?(pool.length%2?'Pairs, plus one trio':'Pairs'):Math.max(1,Math.ceil(pool.length/D.size))+' groups of up to '+D.size);
      if(Array.isArray(D.result)){
        out.replaceChildren(h('div',{class:'pk-grid'},D.result.map((g,i)=>{
          const label=D.mode==='pairs'?(g.length===2?'Pair':g.length===3?'Trio':'Solo'):'Group';
          return h('div',{class:'pk-card'},h('div',{class:'pk-ch'},label+' '+(i+1)),h('ul',null,g.map(n=>h('li',null,n))));
        })));
      }else{
        out.replaceChildren(h('div',{class:'pk-hint'},'Press '+go.textContent+'.'));
      }
    }
  }
  classHooks.push(()=>{
    if(!getClass()){D.classId=S.classes[0]?S.classes[0].id:null;D.result=null;D.used=[];}
    const c=getClass();if(c)D.used=D.used.filter(s=>c.students.includes(s));
    draw();
  });
  draw();
}

/* ---------- Reading names from lists, spreadsheets, PDFs, and photos ---------- */
/* Everything runs in this browser. Libraries load from a CDN only when a file type needs them,
   and student names are never sent anywhere. */
const LIBS={
  xlsx:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  ocr:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  ocrWorker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  ocrCore:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',
  ocrLang:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'
};
const loadedLibs={};
function loadScript(src){
  return loadedLibs[src]||(loadedLibs[src]=new Promise((res,rej)=>{
    const sc=document.createElement('script');sc.src=src;sc.onload=res;
    sc.onerror=()=>{delete loadedLibs[src];sc.remove();rej(new Error('Could not load a helper. Check the internet connection.'));};
    document.head.append(sc);
  }));
}
/* Column labels, titles, and school subjects that should never be read as a student's name. */
const NOT_NAMES=/^(name|names|student|students|first|last|first name|last name|full name|class|period|grade|roster|teacher|room|advisor|advisory|homeroom|section|page|date|email|id|total|list|english|math|mathematics|algebra|geometry|calculus|science|biology|chemistry|physics|history|spanish|french|latin|chinese|humanities|ela|social studies)$/i;
const titleCase=w=>w===w.toUpperCase()&&w.length>1?w.charAt(0)+w.slice(1).toLowerCase():w;
/* One line of text to {first,last}, or null if it does not look like a name.
   Handles numbering and bullets, "Last, First", and stray emails or ID numbers after the name. */
function nameFromLine(line){
  let t=String(line).replace(/\t+/g,' ').replace(/^\s*(\(?\d{1,3}[.)\]:-]?|[-*•●·])\s+/,'').trim();
  t=t.split(/\s+/).filter((w,i,a)=>{if(/[\d@]/.test(w)){a.length=i;return false;}return true;}).join(' ');
  t=t.replace(/[|;:_]+.*$/,'').replace(/\s+/g,' ').trim().replace(/^[^A-Za-zÀ-ɏ]+|[^A-Za-zÀ-ɏ.'’)]+$/g,'');
  if(!t||NOT_NAMES.test(t)||t.split(/[\s,]+/).some(w=>NOT_NAMES.test(w)))return null;
  let first,last;
  const c=t.split(',');
  if(c.length===2){last=c[0].trim();first=c[1].trim();}
  else if(c.length===1){const w=t.split(' ');first=w[0];last=w.slice(1).join(' ');}
  else return null;
  const all=(first+' '+last).trim().split(' ');
  if(!first||all.length>4||!all.every(w=>/^[A-Za-zÀ-ɏ][A-Za-zÀ-ɏ.'’()-]*$/.test(w)))return null;
  return {first:first.split(' ').map(titleCase).join(' '),last:last.split(' ').filter(Boolean).map(titleCase).join(' ')};
}
/* Rows of cells to names. Uses a header row when there is one: First and Last columns, a Preferred
   first name if present, or a single Name column. Without a header, each row is read as one name. */
function namesFromRows(rows){
  rows=rows.map(r=>r.map(c=>String(c==null?'':c).trim())).filter(r=>r.some(Boolean));
  const hi=rows.slice(0,6).findIndex(r=>r.some(c=>/name|first|last|student/i.test(c)&&c.length<40));
  const out=[];
  if(hi>=0){
    const hd=rows[hi].map(c=>c.toLowerCase());
    const col=re=>hd.findIndex(c=>re.test(c));
    const pref=col(/preferred|nickname/),fi=col(/first|given/),la=col(/last|surname|family/),
          full=col(/^(student\s*)?(full\s*)?name$|^student$|^name/);
    rows.slice(hi+1).forEach(r=>{
      const f=(pref>=0&&r[pref])||(fi>=0&&r[fi])||'';
      if(f&&la>=0){const n=nameFromLine(f+' '+r[la]);if(n){n.first=titleCase(f.split(' ')[0]);n.last=r[la].split(' ').map(titleCase).join(' ');out.push(n);}}
      else if(full>=0&&r[full]){const n=nameFromLine(r[full]);if(n)out.push(n);}
      else if(f){const n=nameFromLine(f);if(n)out.push(n);}
    });
  }else rows.forEach(r=>{const n=nameFromLine(r.filter(Boolean).join(' '));if(n)out.push(n);});
  const seen=new Set();
  return out.filter(n=>{const k=(n.first+' '+n.last).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
}
function parseCSV(text,sep){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;
  }
  row.push(cell);rows.push(row);
  return rows;
}
/* Plain text (pasted, or read from a PDF or photo) to names. Tabbed text is read as a table. */
function namesFromText(text){
  const lines=String(text).split(/\r?\n/);
  if(lines.filter(l=>l.includes('\t')).length>=2) return namesFromRows(parseCSV(text,'\t'));
  /* Not a table: read each line on its own, skipping titles and column labels. */
  const seen=new Set();
  return lines.map(nameFromLine).filter(n=>{if(!n)return false;const k=(n.first+' '+n.last).toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
}
async function ocrImages(images,progress){
  await loadScript(LIBS.ocr);
  const worker=await Tesseract.createWorker('eng',1,{workerPath:LIBS.ocrWorker,corePath:LIBS.ocrCore,langPath:LIBS.ocrLang,
    logger:m=>{if(m.status==='recognizing text')progress('Reading the text... '+Math.round(m.progress*100)+'%');else progress('Getting the text reader ready...');}});
  let text='';
  try{for(const im of images){const r=await worker.recognize(im);text+=r.data.text+'\n';}}
  finally{await worker.terminate();}
  return text;
}
async function readPDF(file,progress){
  await loadScript(LIBS.pdf);
  pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS.pdfWorker;
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let text='';
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i),tc=await page.getTextContent(),lines=new Map();
    tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(!lines.has(y))lines.set(y,[]);lines.get(y).push(it);});
    [...lines.keys()].sort((a,b)=>b-a).forEach(y=>{text+=lines.get(y).sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str).join(' ')+'\n';});
  }
  if(text.replace(/\s/g,'').length>20) return text;
  /* A scanned PDF has no text layer, so read each page as a picture. */
  const canvases=[];
  for(let i=1;i<=Math.min(doc.numPages,10);i++){
    const page=await doc.getPage(i),vp=page.getViewport({scale:2}),c=document.createElement('canvas');
    c.width=vp.width;c.height=vp.height;
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    canvases.push(c);
  }
  return ocrImages(canvases,progress);
}
async function namesFromFile(file,progress){
  const n=file.name.toLowerCase(),t=file.type;
  if(/\.(xlsx|xls|ods)$/.test(n)){
    progress('Opening the spreadsheet...');
    await loadScript(LIBS.xlsx);
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    return namesFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}));
  }
  if(/\.(csv|tsv)$/.test(n)||t==='text/csv'){
    const txt=await file.text();
    return namesFromRows(parseCSV(txt,/\.tsv$/.test(n)||(!txt.includes(',')&&txt.includes('\t'))?'\t':','));
  }
  if(/\.pdf$/.test(n)||t==='application/pdf'){progress('Reading the PDF...');return namesFromText(await readPDF(file,progress));}
  if(t.startsWith('image/')){progress('Getting the text reader ready...');return namesFromText(await ocrImages([file],progress));}
  if(/\.(txt|text)$/.test(n)||t.startsWith('text/'))return namesFromText(await file.text());
  throw new Error('That file type is not supported. Use a CSV, Excel, PDF, or picture.');
}
/* How names appear in the class list. "first" adds a last initial when two students share a first name. */
function formatNames(people,fmt){
  const count={};people.forEach(p=>{const k=p.first.toLowerCase();count[k]=(count[k]||0)+1;});
  return people.map(p=>{
    const ini=p.last?p.last.charAt(0).toUpperCase():'';
    if(fmt==='full')return (p.first+' '+p.last).trim();
    if(fmt==='first'&&count[p.first.toLowerCase()]<2)return p.first;
    return (p.first+(ini?' '+ini:'')).trim();
  });
}

        const f=$('#clOne',box);if(f)f.focus();
        if(sk){const m=$('#clMsg',box);if(m)m.textContent=v+' is already in this class. Add a last initial to tell students apart.';}
      };
      one.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addOne();}});
      msg.id='clMsg';
      const roster=h('ol',{class:'cl-roster'},cls.students.map((n,i)=>{
        const rm=h('button',{class:'ag-rm',type:'button',title:'Remove '+n,'aria-label':'Remove '+n},'×');
        rm.addEventListener('click',()=>{

        });
        return h('li',null,h('span',{class:'cl-n'},(i+1)+'.'),h('span',{class:'cl-nm'},n),rm);
      }));
      /* Review box: pasted or imported names land here to be checked and fixed before they are added. */

      const fileIn=h('input',{type:'file',hidden:true,accept:'.csv,.tsv,.txt,.xlsx,.xls,.ods,.pdf,image/*','aria-label':'Choose a roster file or picture'});
      const takeFile=f=>{

let popEl=null,popFor=null;
function closePop(){
  if(popEl){popEl.remove();popEl=null;popFor=null;document.removeEventListener('pointerdown',onDocDown,true);}

function onDocDown(e){
  if(popEl&&!popEl.contains(e.target)&&!(popFor&&popFor.contains(e.target)))closePop();

/* align 'center' centers the popover under its button; the default lines up their left edges. */
function openPop(anchor,fill,align){
  if(popEl&&popFor===anchor){closePop();return;}
  closePop();
  popEl=h('div',{class:'pop'});popFor=anchor;
  fill(popEl);
  document.body.append(popEl);
  const a=anchor.getBoundingClientRect(),pw=popEl.offsetWidth,ph=popEl.offsetHeight;
  popEl.style.left=clamp(align==='center'?a.left+a.width/2-pw/2:a.left,16,Math.max(16,window.innerWidth-pw-16))+'px';
  let top=a.bottom+6;
  if(top+ph>window.innerHeight-8) top=Math.max(8,a.top-ph-6);
  popEl.style.top=top+'px';
  document.addEventListener('pointerdown',onDocDown,true);
}

/* ---------- Backup ---------- */
function downloadBackup(note){
  S.lastBackup=Date.now();
  clearTimeout(saveT);flush();
  const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+(note?' '+note:'');
  const blob=new Blob([JSON.stringify({app:'classboard',v:1,saved:d.toISOString(),data:S})],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:'Classboard backup '+day+'.json'});
  document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(note?'Saved a backup of your current boards first, just in case.':'Backup downloaded. Keep it somewhere safe, like Google Drive.');
}
function readBackup(f){
  return f.text().then(txt=>{
    const j=JSON.parse(txt);
    const D=j&&j.app==='classboard'&&j.data?j.data:j;
    if(!D||!Array.isArray(D.screens)||!D.screens.length) throw new Error('bad');
    return normalize(D);
  });
}

      h('p',null,'Saves every screen, widget, image, and class list to one file.'),

      h('button',{class:'btn',type:'button',onclick:()=>file.click()},'Import backup'),

    file.addEventListener('change',()=>{
      const f=file.files[0];file.value='';if(!f)return;
      readBackup(f).then(D=>{

        const go=h('button',{class:'btn danger',type:'button',onclick:()=>{
          /* Download the current boards before replacing them, so an import can always be reversed. */
          downloadBackup('before import');
          D.lastBackup=S.lastBackup;D.since=S.since;
          S=D;Object.keys(RT).forEach(k=>delete RT[k]);
          closePop();syncBrand();document.body.classList.toggle('calm',!!S.calm);renderTabs();renderBoard();

/* ---------- Floating clock and timer (Document Picture-in-Picture, Chrome and Edge) ---------- */
/* Dial faces: [minutes on the face, minutes between labels]. The smallest face that fits the timer is used. */
const FACES=[[5,1],[10,2],[15,5],[20,5],[30,5],[60,5],[90,15],[120,15]];
function dialSVG(left,dur,c){
  const [max,step]=FACES.find(f=>f[0]>=dur/60)||FACES[FACES.length-1];
  const P=(r,m)=>{const a=m/max*2*Math.PI;return [(100+r*Math.sin(a)).toFixed(2),(100-r*Math.cos(a)).toFixed(2)];};
  let s='<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Time left">';
  for(let m=0;m<max;m+=max<=60?1:5){
    const big=m%step===0,[x1,y1]=P(big?70:74,m),[x2,y2]=P(79,m);
    s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c.ink+'" stroke-width="'+(big?2:1)+'" stroke-linecap="round"/>';
  }
  for(let m=0;m<max;m+=step){const [x,y]=P(90,m);s+='<text x="'+x+'" y="'+y+'" font-size="11" text-anchor="middle" dominant-baseline="central" fill="'+c.ink+'">'+m+'</text>';}
  const f=clamp(left/(max*60),0,1),R=64;
  s+='<circle cx="100" cy="100" r="'+R+'" fill="'+c.soft+'"/>';
  if(f>.9999) s+='<circle cx="100" cy="100" r="'+R+'" fill="'+c.accent+'"/>';
  else if(f>0){const [x,y]=P(R,f*max);s+='<path d="M100 100 L100 '+(100-R)+' A'+R+' '+R+' 0 '+(f>.5?1:0)+' 1 '+x+' '+y+' Z" fill="'+c.accent+'"/>';}
  const txt=c.done?'Time is up':fmtTime(left);
  s+='<circle cx="100" cy="100" r="38" fill="'+c.panel+'"/>';
  s+='<text x="100" y="101" font-size="'+(c.done?13:txt.length>5?16:21)+'" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="'+c.ink+'" style="font-variant-numeric:tabular-nums">'+txt+'</text>';
  return s+'</svg>';
}

    if(rt.toggle){rt.toggle();}
    else if(rt.running){rt.left=Math.max(0,(rt.endAt-Date.now())/1000);rt.running=false;}
    else{ensureAudio();if(rt.done||rt.left<=0)rt.left=w.data.dur;rt.done=false;rt.endAt=Date.now()+rt.left*1000;rt.running=true;lastTimer=w.id;}
    draw();
  });
  let lastSvg='',lastPlay='';
  const draw=()=>{
    const n=new Date(),h24=cw&&cw.data.h24;
    let hh=n.getHours(),ap='';
    if(!h24){ap=hh>=12?'PM':'AM';hh=hh%12||12;}else hh=String(hh).padStart(2,'0');
    t.replaceChildren(hh+':'+String(n.getMinutes()).padStart(2,'0'),ap?h('span',{class:'ampm'},ap):'');
    const w=pick();
    d.body.classList.toggle('clockonly',!w);
    if(!w){d.body.classList.remove('done');return;}
    const rt=rtOf(w);
    let left=rt.running?(rt.endAt-Date.now())/1000:rt.left;
    /* If the timer's screen is not showing, the board cannot ring the bell, so ring it here. */
    if(rt.running&&left<=0&&!boardEl.querySelector('[data-id="'+w.id+'"]')){rt.running=false;rt.left=0;rt.done=true;if(w.data.bell)beep();}
    if(rt.done) left=0;
    d.body.classList.toggle('done',!!rt.done);
    const svg=dialSVG(left,w.data.dur,Object.assign({done:rt.done},c,rt.done?{ink:v('--on-sun'),panel:v('--sun')}:{}));
    if(svg!==lastSvg){dial.innerHTML=svg;lastSvg=svg;}
    const pl=rt.running?'pause':'play';
    if(pl!==lastPlay){play.innerHTML=rt.running?ICON_PAUSE:ICON_PLAY;play.setAttribute('aria-label',rt.running?'Pause timer':'Start timer');lastPlay=pl;}
  };
  draw();
  const iv=setInterval(draw,250);
  $('#bFloat').textContent='Close float';
  pipWin.addEventListener('pagehide',()=>{clearInterval(iv);pipWin=null;$('#bFloat').textContent='Float clock';});
}

/* ---------- Screens ---------- */
const tabsEl=$('#tabs');
function renderTabs(){
  tabsEl.replaceChildren(...S.screens.map(sc=>
    h('button',{class:'tab'+(sc.id===S.active?' on':''),type:'button','aria-pressed':String(sc.id===S.active),onclick:()=>switchTo(sc.id)},sc.name||'Untitled')),
    h('button',{class:'tab add',type:'button',title:'New screen','aria-label':'New screen',onclick:()=>{
      const sc={id:uid(),name:'Screen '+(S.screens.length+1),bg:cur().bg,widgets:guideWidgets()};
      S.screens.push(sc);switchTo(sc.id);
    }},'+'));
  const on=$('.tab.on',tabsEl);if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'});
  syncPbar();
}
function switchTo(id){S.active=id;save();renderTabs();renderBoard();}
function go(d){
  const i=S.screens.findIndex(s=>s.id===S.active);
  switchTo(S.screens[(i+d+S.screens.length)%S.screens.length].id);
}

/* ---------- Present mode ---------- */
let presenting=false,fsOn=false;
function syncPbar(){
  $('#pName').textContent=cur().name||'Untitled';
  $('#pPrev').disabled=$('#pNext').disabled=S.screens.length<2;
}
/* The present bar shows fully on entering Present mode and on mouse movement, then fades after 3 seconds. */
let wakeT=null;
function wakePbar(){
  if(!presenting)return;
  const b=$('#pbar');b.classList.add('wake');
  clearTimeout(wakeT);wakeT=setTimeout(()=>b.classList.remove('wake'),3000);
}
document.addEventListener('pointermove',wakePbar);
function setPresent(on){
  presenting=on;document.body.classList.toggle('present',on);closePop();
  if(on){
    try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  }else if(document.fullscreenElement){
    try{document.exitFullscreen();}catch(e){}
  }
  syncPbar();
  if(on)wakePbar();
}
document.addEventListener('fullscreenchange',()=>{
  if(document.fullscreenElement)fsOn=true;
  else if(fsOn){fsOn=false;if(presenting)setPresent(false);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(popEl){closePop();return;}
    if(presenting)setPresent(false);
    return;
  }
  if(!presenting)return;
  const t=e.target;
  if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown')go(1);
  else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});

/* Dropping a file outside an image widget should not navigate away. */
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>{
  if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault();
}));

/* ---------- Toolbar wiring ---------- */
$('#bUndo').addEventListener('click',undo);
$('#bAdd').addEventListener('click',e=>addPop(e.currentTarget));
$('#bGear').addEventListener('click',e=>gearPop(e.currentTarget));
$('#bFloat').addEventListener('click',floatClock);
$('#bPresent').addEventListener('click',()=>setPresent(true));
$('#pPrev').addEventListener('click',()=>go(-1));
$('#pNext').addEventListener('click',()=>go(1));
$('#pExit').addEventListener('click',()=>setPresent(false));
$('#pCalm').addEventListener('click',()=>setCalm(!S.calm));

syncBrand();
/* Remind about backups once per visit, after the first week of use, if the last one is over two weeks old. */
if(!S.since){S.since=Date.now();save();}
{
  const DAY=864e5,now=Date.now();
  if(now-S.since>7*DAY&&(!S.lastBackup||now-S.lastBackup>14*DAY))
    setTimeout(()=>toast(S.lastBackup?'It has been over two weeks since your last backup.':'You have not downloaded a backup yet.',{label:'Download backup',fn:()=>downloadBackup()}),2500);
}
record();
if(S.calm){document.body.classList.add('calm');$('#pCalm').classList.add('primary');$('#pCalm').setAttribute('aria-pressed','true');}
renderTabs();
renderBoard();
})();
</script>
